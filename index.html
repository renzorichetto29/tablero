<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ruma Home · Tablero de control</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{color-scheme:light;--bg:#EFEDE9;--card:#FAF9F7;--ink:#2B2A28;--mut:#6E6A63;--line:#DDD8D0;--g:#0b7a52;--o:#c2410c;--r:#b42323;--b:#2457c5;--gs:#E1EFE7;--os:#F6E5D9;--bs:#E2E8F5;--side:#D1CBC1;--navtx:#47443F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;margin:0}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%;min-width:0}
.inp:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--b);border-color:var(--b);color:#fff}
.app{display:flex;min-height:100vh}.app>main{flex:1;min-width:0}
.side{position:sticky;top:0;height:100vh;width:248px;flex:none;background:var(--side);padding:12px;display:flex;flex-direction:column;gap:4px;transition:width .2s ease;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;z-index:20}
.side.col{width:68px;padding:12px 8px}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 14px}
.logo{height:84px;width:auto;display:block;max-width:150px;object-fit:contain}
.side.col .side-h{flex-direction:column;justify-content:center;gap:12px;padding:4px 0 14px}
.side.col .logo{height:42px;max-width:48px}
.sbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;border-radius:8px;border:1px solid rgba(43,42,40,.18);background:rgba(250,249,247,.55);color:var(--ink);cursor:pointer}
.sbtn:hover{background:var(--card)}.sbtn:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.tg-m{display:none}.side.col .tg-d svg{transform:rotate(180deg)}
.side-n{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--navtx);font-size:14px;white-space:nowrap;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.nav:hover{background:rgba(43,42,40,.08)}.nav.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(43,42,40,.12)}
.nav svg{flex:none}
.side.col .nav{justify-content:center;padding:10px 0}.side.col .nl{display:none}
@media (max-width:767px){
 .app{flex-direction:column}
 .side,.side.col{position:sticky;top:0;height:auto;width:100%;padding:8px 12px;flex-direction:column;overflow:visible}
 .side-h,.side.col .side-h{flex-direction:row;justify-content:space-between;padding:0}
 .logo,.side.col .logo{height:48px;max-width:120px}
 .tg-d{display:none}.tg-m{display:inline-flex}
 .side-n{display:none;max-height:calc(100vh - 70px);overflow-y:auto;padding:10px 0 4px}
 .side.mob .side-n{display:flex}
 .side.col .nav{justify-content:flex-start;padding:9px 12px}.side.col .nl{display:inline}
}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:12px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.cd{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:74px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:11px;text-align:left;overflow:hidden;min-width:0}.cd:hover{background:var(--bg)}.cd.sel{outline:2px solid var(--b);outline-offset:-1px}
.cajag{display:grid;gap:16px}.cajaside{align-self:start}@media(min-width:1100px){.cajag{grid-template-columns:minmax(0,1fr) 340px}.cajaside{position:sticky;top:12px}}
.bd{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:100}
.gcard{width:100%;max-width:380px;padding:22px}
.gtoast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#b42323;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:300;max-width:92vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gpill{position:fixed;right:10px;bottom:10px;z-index:60;display:flex;gap:6px;align-items:center;background:rgba(250,249,247,.94);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:12px;color:var(--mut);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gpill button{border:0;background:var(--side);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.gmodal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
</style>
</head>

<script>
/* Ruma Home - arranque: inicio de sesión, conexión con Google Sheets (vía Apps Script) y carga del tablero */
(function () {
  'use strict';
  var CFG = window.RUMA_CONFIG || {};
  var API = CFG.API_URL || '';
  var LS = 'ruma_sesion_v1';
  var sess = null;           // {token, user}
  var pollTimer = null;

  /* ---------- utilidades de pantalla ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style') el.style.cssText = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }
  var gate = document.getElementById('gate');
  function show(node) { gate.innerHTML = ''; gate.style.display = 'flex'; gate.appendChild(node); }
  function hideGate() { gate.style.display = 'none'; gate.innerHTML = ''; }
  function card(title, children) {
    return h('div', { class: 'card gcard' },
      h('img', { src: window.RUMA_LOGO, alt: 'Ruma Home', style: 'height:64px;margin:0 auto 6px;display:block' }),
      h('h1', { style: 'font-size:20px;margin:6px 0 14px;text-align:center' }, title),
      children);
  }
  function toast(msg, bad) {
    var t = h('div', { class: 'gtoast', style: bad === false ? 'background:#0b7a52' : '' }, msg);
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 5000);
  }
  window.__toast = toast;

  /* ---------- comunicación con Apps Script ---------- */
  function fail(code, msg) { var e = new Error(msg); e.code = code; return e; }
  // Todo viaja con GET: Google redirige los POST y algunos navegadores los rechazan (error 405).
  // Los pedidos grandes se comprimen y se mandan en pedazos; el servidor los vuelve a armar.
  var CH = 1800;
  function b64(u8) {
    var s = '', i = 0, N = 0x8000;
    for (; i < u8.length; i += N) s += String.fromCharCode.apply(null, u8.subarray(i, i + N));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_');
  }
  async function pack(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
    if (bytes.length > 1200 && window.CompressionStream) {
      try {
        var gz = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
        if (gz.length < bytes.length) { bytes = gz; z = 1; }
      } catch (e) { /* sin compresión */ }
    }
    return { p: b64(bytes), z: z };
  }
  async function call(params) {
    var url = API + (API.indexOf('?') < 0 ? '?' : '&') + Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    var res;
    try { res = await fetch(url); } catch (e) {
      throw fail('red', 'No se pudo conectar con el servidor. Revisá tu conexión a internet y que la implementación de Apps Script esté en acceso "Cualquier usuario".');
    }
    var j;
    try { j = await res.json(); } catch (e) {
      throw fail('servidor', 'El servidor respondió algo inesperado. Revisá que la implementación de Apps Script permita acceso a "Cualquier usuario".');
    }
    if (!j.ok) throw fail(j.code || 'error', j.error || 'Error desconocido');
    return j;
  }
  async function api(body, intento) {
    var e = await pack(body);
    if (e.p.length <= CH) return call({ p: e.p, z: e.z });
    var id = Math.random().toString(36).slice(2, 12) + 'x', n = Math.ceil(e.p.length / CH), next = 0;
    async function worker() { while (next < n) { var i = next++; await call({ a: 'chunk', id: id, i: i, n: n, d: e.p.slice(i * CH, (i + 1) * CH) }); } }
    try {
      await Promise.all([worker(), worker(), worker(), worker()]);
      return await call({ a: 'commit', id: id, n: n, z: e.z });
    } catch (err) {
      if (err.code === 'incompleto' && !intento) return api(body, 1);
      throw err;
    }
  }
  function saveSess(s) { try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {} }
  function loadSess() { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } }
  function logout() { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); }

  /* ---------- base de datos para el tablero (misma interfaz que usaba dentro de Claude) ---------- */
  function makeDB(initial) {
    var data = initial || {};
    var subs = {};
    var ver = 0;           // sube con cada escritura: descarta lecturas viejas
    var lastSync = Date.now();
    function docsOf(n) {
      return (data[n] || []).map(function (d) {
        var o = {}; for (var k in d) if (k !== 'id') o[k] = d[k];
        return { id: d.id, data: function () { return o; } };
      });
    }
    function emit() { for (var n in subs) subs[n].forEach(function (cb) { try { cb({ docs: docsOf(n) }); } catch (e) {} }); }
    async function refresh() {
      var v0 = ver;
      var j = await api({ a: 'list', token: sess.token });
      if (v0 !== ver) return;           // hubo cambios propios mientras tanto
      data = j.cols; lastSync = Date.now(); emit();
    }
    async function write(body, apply) {
      ver++;
      try { await api(Object.assign({ token: sess.token }, body)); }
      catch (e) { onWriteError(e); throw e; }
      ver++;
      var arr = data[body.col] = data[body.col] || [];
      apply(arr);
    }
    function idx(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i; return -1; }
    var db = {
      collection: function (name) {
        return {
          onSnapshot: function (cb) {
            (subs[name] = subs[name] || new Set()).add(cb);
            Promise.resolve().then(function () { cb({ docs: docsOf(name) }); });
            return function () { subs[name].delete(cb); };
          },
          doc: function (id) {
            return {
              set: function (doc) {
                return write({ a: 'set', col: name, id: id, doc: doc }, function (arr) {
                  var o = Object.assign({}, doc, { id: id }), i = idx(arr, id); if (i < 0) arr.push(o); else arr[i] = o;
                });
              },
              update: function (p) {
                return write({ a: 'update', col: name, id: id, doc: p }, function (arr) {
                  var i = idx(arr, id); if (i >= 0) arr[i] = Object.assign({}, arr[i], p);
                });
              },
              delete: function () {
                return write({ a: 'delete', col: name, id: id }, function (arr) {
                  var i = idx(arr, id); if (i >= 0) arr.splice(i, 1);
                });
              }
            };
          }
        };
      }
    };
    // actualizar al volver a la pestaña y cada 2 minutos
    function tick() { if (document.visibilityState === 'visible' && Date.now() - lastSync > 45000) refresh().catch(function (e) { if (e.code === 'sesion') onWriteError(e); }); }
    document.addEventListener('visibilitychange', tick);
    pollTimer = setInterval(tick, 120000);
    return db;
  }

  function onWriteError(e) {
    if (e.code === 'sesion') { toast('La sesión venció. Se va a pedir la clave de nuevo.', true); setTimeout(logout, 2500); return; }
    if (e.code === 'permiso') { toast('Tu usuario es de solo lectura: no se guardó el cambio.', true); return; }
    toast('No se pudo guardar: ' + e.message, true);
  }

  /* ---------- datos sueltos (ventas del punto de venta) ---------- */
  function makeKV(kv) {
    var cur = Object.assign({}, kv || {}), timers = {};
    return {
      get: function (k) { return cur[k] == null ? null : cur[k]; },
      set: function (k, v) {
        if (cur[k] === v) return;
        cur[k] = v;
        if (!sess || sess.user.rol !== 'admin') return;
        clearTimeout(timers[k]);
        timers[k] = setTimeout(function () {
          api({ a: 'kvset', token: sess.token, key: k, value: v }).catch(onWriteError);
        }, 1500);
      }
    };
  }

  /* ---------- pantallas ---------- */
  function screenConfig() {
    show(card('Falta conectar el servidor', h('div', { class: 'mut', style: 'font-size:14px;line-height:1.5' },
      'Abrí el archivo config.js y pegá ahí la dirección (URL) de tu implementación de Apps Script. La guía paso a paso explica cómo obtenerla.')));
  }
  function screenError(msg, retry) {
    show(card('No se pudo cargar', h('div', null,
      h('p', { class: 'mut', style: 'font-size:14px;line-height:1.5;margin:0 0 12px' }, msg),
      h('div', { style: 'display:flex;gap:8px;justify-content:center' },
        h('button', { class: 'btn p', onclick: retry }, 'Reintentar'),
        h('button', { class: 'btn', onclick: logout }, 'Cambiar de usuario')))));
  }
  function screenLoading(t) { show(card(t || 'Cargando…', h('div', { class: 'mut', style: 'text-align:center;font-size:14px' }, 'Un momento por favor.'))); }

  function screenLogin(msg) {
    var u = h('input', { class: 'inp', type: 'text', autocomplete: 'username', autocapitalize: 'none', placeholder: 'Usuario' });
    var p = h('input', { class: 'inp', type: 'password', autocomplete: 'current-password', placeholder: 'Clave' });
    var err = h('div', { style: 'color:var(--r);font-size:13px;min-height:18px;margin-top:8px' }, msg || '');
    var btn = h('button', { class: 'btn p', type: 'submit', style: 'width:100%;justify-content:center;margin-top:12px' }, 'Entrar');
    var f = h('form', {
      onsubmit: async function (ev) {
        ev.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
        try {
          var j = await api({ a: 'login', usuario: u.value, clave: p.value });
          sess = { token: j.token, user: j.user }; saveSess(sess); start();
        } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar'; }
      }
    }, h('div', { style: 'display:grid;gap:8px' }, u, p), btn, err);
    show(card('Tablero de control', f)); u.focus();
  }

  /* ---------- importar / respaldar (solo administradores) ---------- */
  function panelAdmin(onDone, firstTime) {
    var file = h('input', { type: 'file', accept: '.json,application/json', class: 'inp' });
    var out = h('div', { style: 'font-size:13px;margin-top:8px;min-height:18px' });
    var ventas = h('textarea', { class: 'inp', rows: '3', placeholder: 'Pegar acá el texto copiado (opcional)', style: 'font-size:12px' });
    function say(t, bad) { out.textContent = t; out.style.color = bad ? 'var(--r)' : 'var(--g)'; }
    var bImp = h('button', {
      class: 'btn p', onclick: async function () {
        var f = file.files[0]; if (!f) return say('Elegí primero un archivo .json', true);
        try {
          var o = JSON.parse(await f.text());
          if (!o.cols && !o.base && !o.kv) return say('El archivo no tiene el formato esperado.', true);
          say('Subiendo… puede tardar unos segundos.');
          var j = await api({ a: 'import', token: sess.token, cols: o.cols, base: o.base, kv: o.kv });
          say('Listo: ' + j.registros + ' registros importados.'); setTimeout(onDone, 900);
        } catch (e) { say(e.message || 'No se pudo importar', true); }
      }
    }, 'Importar archivo');
    var bVen = h('button', {
      class: 'btn', onclick: async function () {
        var t = ventas.value.trim(); if (!t) return say('Pegá primero el texto.', true);
        try { JSON.parse(t); await api({ a: 'kvset', token: sess.token, key: 'ruma_ventas', value: t }); say('Ventas del punto de venta guardadas.'); setTimeout(onDone, 900); }
        catch (e) { say(e.message || 'Texto inválido', true); }
      }
    }, 'Guardar ventas pegadas');
    var bExp = h('button', {
      class: 'btn', onclick: async function () {
        try {
          say('Preparando copia…');
          var j = await api({ a: 'export', token: sess.token }); delete j.ok;
          var blob = new Blob([JSON.stringify(j)], { type: 'application/json' });
          var a = h('a', { href: URL.createObjectURL(blob), download: 'ruma_respaldo_' + new Date().toISOString().slice(0, 10) + '.json' });
          document.body.appendChild(a); a.click(); a.remove(); say('Copia descargada.');
        } catch (e) { say(e.message, true); }
      }
    }, 'Descargar copia de seguridad');
    var body = h('div', { style: 'display:grid;gap:10px;font-size:14px' },
      firstTime ? h('p', { class: 'mut', style: 'margin:0;line-height:1.5' }, 'Todavía no se cargó la información inicial. Elegí el archivo migracion.json que te pasé.') : null,
      h('div', null, h('b', null, '1. Importar datos'), h('div', { class: 'mut', style: 'font-size:12px;margin:2px 0 6px' }, 'Archivo migracion.json o una copia de seguridad. Si un registro ya existe, se reemplaza.'), file, h('div', { style: 'margin-top:8px' }, bImp)),
      firstTime ? null : h('div', null, h('b', null, '2. Ventas del punto de venta guardadas'), h('div', { class: 'mut', style: 'font-size:12px;margin:2px 0 6px' }, 'Solo si cargaste ventas en la pestaña Ventas del tablero anterior.'), ventas, h('div', { style: 'margin-top:8px' }, bVen)),
      firstTime ? null : h('div', null, h('b', null, '3. Copia de seguridad'), h('div', { style: 'margin-top:6px' }, bExp)),
      out);
    return body;
  }
  function modalAdmin() {
    var m = h('div', { class: 'gmodal' });
    var box = h('div', { class: 'card gcard', style: 'max-width:480px;max-height:90vh;overflow:auto' },
      h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px' }, h('h2', { style: 'font-size:17px;margin:0' }, 'Datos y respaldo'),
        h('button', { class: 'btn', onclick: function () { m.remove(); } }, 'Cerrar')),
      panelAdmin(function () { location.reload(); }, false));
    m.appendChild(box); m.addEventListener('click', function (e) { if (e.target === m) m.remove(); });
    document.body.appendChild(m);
  }
  function screenFirstTime() {
    var box = card('Primera vez', h('div', null, panelAdmin(function () { start(); }, true),
      h('div', { style: 'margin-top:12px;text-align:center' }, h('button', { class: 'btn', onclick: logout }, 'Salir'))));
    show(box);
  }

  function pill() {
    var u = sess.user;
    var el = h('div', { class: 'gpill' },
      h('span', null, u.nombre + (u.rol === 'admin' ? '' : ' (solo lectura)')),
      u.rol === 'admin' ? h('button', { onclick: modalAdmin }, 'Datos') : null,
      h('button', { onclick: logout }, 'Salir'));
    document.body.appendChild(el);
  }

  /* ---------- arranque ---------- */
  var booting = false;
  async function start() {
    if (!API || /PEGAR/.test(API)) return screenConfig();
    if (!sess) sess = loadSess();
    if (!sess || !sess.token) return screenLogin();
    if (booting) return; booting = true;
    screenLoading('Cargando tus datos…');
    try {
      var j = await api({ a: 'boot', token: sess.token });
      sess.user = j.user; saveSess(sess);
      var b = j.base || {};
      if (!b.RAW || !b.OLDDUX || !b.VD || !b.DX) {
        booting = false;
        if (sess.user.rol === 'admin') return screenFirstTime();
        return screenError('Todavía no se cargó la información inicial. Pedile al administrador que la cargue.', start);
      }
      window.__RUMA = { RAW: b.RAW, OLDDUX: b.OLDDUX, VD: b.VD, DX: b.DX };
      window.__KV = makeKV(j.kv);
      var db = makeDB(j.cols);
      window.claude = { use: async function (n) { return n === 'db' ? db : null; } };
      var s = document.createElement('script');
      s.src = 'app.js?v=' + (CFG.BUILD || '1');
      s.onload = function () { hideGate(); pill(); };
      s.onerror = function () { booting = false; screenError('No se pudo descargar el tablero (app.js). Revisá que el archivo esté subido a GitHub.', start); };
      document.body.appendChild(s);
    } catch (e) {
      booting = false;
      if (e.code === 'sesion') { try { localStorage.removeItem(LS); } catch (x) {} sess = null; return screenLogin('La sesión venció. Ingresá de nuevo.'); }
      screenError(e.message, start);
    }
  }
  start();
})();

</script>
</body>
</html>
